<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>健身打卡</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="styles/style.css">
</head>
<body>
    <!-- 主应用（登录后显示） -->
    <div id="app" class="hidden">
        <header>
            <div id="header-title"></div>
            <div id="user-bar">
                <button id="open-migration" class="header-action-btn">数据迁移</button>
                <button id="logout" class="header-action-btn">退出登录</button>
            </div>
        </header>
        <main>
            <section id="calendar">
                <div id="controls">
                    <button id="prev-month">上个月</button>
                    <span id="current-month" class="current-month"></span>
                    <button id="next-month">下个月</button>
                </div>
                <div id="check-in-summary-container">
                    <span id="yearly-check-in-summary" class="check-in-summary"></span>
                    <span id="check-in-summary" class="check-in-summary"></span>
                </div>
                <div id="calendar-container"></div>
            </section>
            <div id="migration-modal" class="hidden">
                <section id="migration-panel" role="dialog" aria-modal="true" aria-labelledby="migration-title">
                    <button id="close-migration" class="icon-close-btn" type="button" aria-label="关闭">×</button>
                    <h2 id="migration-title">数据迁移</h2>
                    <p class="migration-target-hint">迁移到当前账号：<span id="migration-current-account"></span></p>
                    <div class="migration-grid">
                        <label>
                            Source 账号
                            <input id="migration-source-email" type="email" placeholder="zhaoxiwen1124@gmail.com">
                        </label>
                    </div>
                    <div id="migration-mode-group" role="radiogroup" aria-label="迁移方式">
                        <label class="migration-mode-option">
                            <input id="migration-mode-incremental" name="migration-mode" type="radio" value="incremental" checked>
                            增量复制
                        </label>
                        <label class="migration-mode-option">
                            <input id="migration-mode-overwrite" name="migration-mode" type="radio" value="overwrite">
                            全量覆盖
                        </label>
                    </div>
                    <button id="migrate-data" class="migration-btn">开始迁移</button>
                    <div id="migration-message"></div>
                </section>
            </div>
        </main>
        <footer>
            <p>&copy; 2026 Sherwin Fitness Check-in</p>
        </footer>
    </div>

    <!-- 登录界面（未登录时显示） -->
    <div id="auth-container">
        <div id="auth-card">
            <h2>健身打卡</h2>
            <p class="auth-hint">登录后自动跨设备同步</p>
            <div id="auth-mode-switch" role="group" aria-label="登录方式">
                <button id="auth-mode-fixed" class="auth-mode active" type="button" aria-pressed="true">固定用户</button>
                <button id="auth-mode-email" class="auth-mode" type="button" aria-pressed="false">邮箱验证码</button>
            </div>
            <div id="auth-step-fixed">
                <input id="auth-password" type="password" placeholder="密码" autocomplete="current-password">
                <button id="fixed-login" class="auth-btn">登录</button>
            </div>
            <div id="auth-step-email" class="hidden">
                <input id="auth-email" type="email" placeholder="邮箱地址" autocomplete="email">
                <button id="send-otp" class="auth-btn">发送验证码</button>
            </div>
            <div id="auth-step-otp" class="hidden">
                <input id="auth-otp" type="text" placeholder="验证码" maxlength="10" inputmode="numeric">
                <button id="verify-otp" class="auth-btn">登录</button>
                <button id="back-to-email" class="link-btn">换个邮箱</button>
            </div>
            <div id="auth-message"></div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="scripts/config.js"></script>
    <script src="scripts/authRedirect.js"></script>
    <script src="scripts/app.auth.js"></script>
</body>
</html>
